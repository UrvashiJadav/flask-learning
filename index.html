<!DOCTYPE html>
<html>
<head>
    <title>Flask Frontend Test</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            text-align: center;
        }

        input {
            padding: 10px;
            width: 200px;
            margin-bottom: 10px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
        }

        #result {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>Send Name to Flask </h2>

    <input type="text" id="nameInput" placeholder="Enter your name">

    <br>

    <button onclick="sendData()">Send</button> <!---on buttonclick sendDATA METHOD WILL BE CALLED--->

    <p id="result"></p>

</div>

<script>
async function sendData() { //ASYNC FUNCTION MEANS THE FUNCTION CALLED AFTER WAITING

    let name = document.getElementById("nameInput").value; //document is whole html code where getelmentbyid is nameinput and the value it will have by user.

    let response = await fetch("http://127.0.0.1:5000/user", { //await is wait for sendimg request accept from server fetch is port of server it will wait untill it accepts. await is neccesaary to write.
        method: "POST", //sends data by using post method
        headers: {
            "Content-Type": "application/json" //extra code defines the format is json
        },
        body: JSON.stringify({ name: name }) //body: actual data send to backend, converts name of js into json format
    });

    let data = await response.json(); //it is a response from server stored in data

    document.getElementById("result").innerText = data.status + "\n" + data.message;
}   //it will find result id from html doc abd add response by server into that and give data.status, its saying data["status"] but its js so data.status.
</script>

</body>
</html>
