<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>

    <style>

        body{
            background-color: burlywood;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial;
        }

        .box{
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            width: 300px;
        }

        input{
            width: 90%;
            padding: 10px;
            margin-top: 10px;
        }

        button{
            margin-top: 15px;
            padding: 10px 20px;
            background-color: green;
            color: white;
            border: none;
            cursor: pointer;
        }

        #result{
            margin-top: 15px;
            font-weight: bold;
        }

    </style>

</head>

<body>

    <div class="box">

        <h1>Registration</h1>

        <input type="text" id="nameid" placeholder="Enter your name">

        <input type="text" id="usernameid" placeholder="Enter your username">

        <input type="password" id="passwordid" placeholder="Enter your password">

        <button type="button" onclick="registerUser()">Submit</button>

        <p id="result"></p>

    </div>

</body>

<script>

async function registerUser() {

    let name = document.getElementById("nameid").value;
    let username = document.getElementById("usernameid").value;
    let password = document.getElementById("passwordid").value;

    let response = await fetch("http://127.0.0.1:5000/register", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            name: name,
            username: username,
            password: password
        })

    });

    let data = await response.json();

    document.getElementById("result").innerText =
    data.status + "\n" + data.message;
}

</script>

</html>
